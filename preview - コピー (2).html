<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>部屋に商品を置いてみる（プレビュー）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      /* 画面スクロールなどのデフォルトジェスチャーを抑止 */
      touch-action: none;
    }

    /* カメラ映像（背景） */
    #cameraVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;      /* 画面全体に表示 */
      background: #000;
      transform: scaleX(-1);  /* 必要なら鏡像を解除：-1 → 1 に変える */
    }

    /* 商品画像のオーバーレイ */
    .overlay-item {
      position: absolute;
      left: 50%;          /* JS側で px に上書きしますが初期値として中央 */
      top: 50%;
      width: 50vw;        /* 初期サイズ：画面幅の50% */
      max-width: 80vh;    /* 縦とのバランス調整 */
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;  /* タップ判定は親コンテナで拾う */
      opacity: 0.95;
    }

    .overlay-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 画面下部の簡易UIバー */
    .bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .status-text {
      font-size: 11px;
      opacity: 0.85;
      white-space: pre-line;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .btn:active {
      background: rgba(255,255,255,0.3);
    }

    .btn.small {
      flex: 0;
      padding-inline: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- 背景のカメラ映像 -->
    <video id="cameraVideo" playsinline autoplay muted></video>

    <!-- 選択中の商品画像 -->
    <div class="overlay-item" id="overlayItem">
      <!-- ★ここを自社商品の画像パスに差し替え可 -->
      <img src="item_sample.png" alt="商品プレビュー画像" />
    </div>

    <!-- 画面下部の簡易UI -->
    <div class="bottom-bar">
      <div class="status-text" id="statusText">
        カメラを起動しています…
      </div>

      <div class="button-row">
        <button class="btn small" id="toggleCameraBtn">
          カメラ再起動
        </button>
        <button class="btn small" id="flipFacingBtn">
          カメラ切替
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const videoEl = document.getElementById('cameraVideo');
      const statusEl = document.getElementById('statusText');
      const toggleCameraBtn = document.getElementById('toggleCameraBtn');
      const flipFacingBtn = document.getElementById('flipFacingBtn');
      const appEl = document.querySelector('.app');
      const overlayItemEl = document.getElementById('overlayItem');

      let currentStream = null;
      let useBackCamera = true; // true: 背面カメラ（environment）優先

      // 商品画像の状態（中心位置＆拡大率）
      const overlayState = {
        centerX: window.innerWidth / 2,
        centerY: window.innerHeight / 2,
        scale: 1
      };

      // 変形を反映
      function updateOverlayTransform() {
        overlayState.scale = clampScale(overlayState.scale);
        overlayItemEl.style.left = overlayState.centerX + 'px';
        overlayItemEl.style.top = overlayState.centerY + 'px';
        overlayItemEl.style.transform =
          'translate(-50%, -50%) scale(' + overlayState.scale + ')';
      }

      function clampScale(s) {
        const min = 0.3;
        const max = 3;
        return Math.min(max, Math.max(min, s));
      }

      // タッチ操作用の一時状態
      const gesture = {
        mode: null,          // 'drag' | 'pinch' | null
        startX: 0,
        startY: 0,
        startCenterX: 0,
        startCenterY: 0,
        startDistance: 0,
        startScale: 1
      };

      function getTouchDistance(touches) {
        if (touches.length < 2) return 0;
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      function onTouchStart(e) {
        if (e.touches.length === 1) {
          // 1本指：ドラッグ
          const t = e.touches[0];
          gesture.mode = 'drag';
          gesture.startX = t.clientX;
          gesture.startY = t.clientY;
          gesture.startCenterX = overlayState.centerX;
          gesture.startCenterY = overlayState.centerY;
        } else if (e.touches.length === 2) {
          // 2本指：ピンチズーム
          gesture.mode = 'pinch';
          gesture.startDistance = getTouchDistance(e.touches);
          gesture.startScale = overlayState.scale;
        }
      }

      function onTouchMove(e) {
        if (!gesture.mode) return;

        if (gesture.mode === 'drag' && e.touches.length === 1) {
          e.preventDefault();
          const t = e.touches[0];
          const dx = t.clientX - gesture.startX;
          const dy = t.clientY - gesture.startY;
          overlayState.centerX = gesture.startCenterX + dx;
          overlayState.centerY = gesture.startCenterY + dy;
          updateOverlayTransform();
        } else if (gesture.mode === 'pinch' && e.touches.length === 2) {
          e.preventDefault();
          const dist = getTouchDistance(e.touches);
          if (gesture.startDistance > 0) {
            const scaleFactor = dist / gesture.startDistance;
            overlayState.scale = gesture.startScale * scaleFactor;
            updateOverlayTransform();
          }
        }
      }

      function onTouchEnd(e) {
        if (e.touches.length === 0) {
          gesture.mode = null;
        } else if (e.touches.length === 1 && gesture.mode === 'pinch') {
          // ピンチから1本指だけ残った場合はいったんリセット
          gesture.mode = null;
        }
      }

      // マウス操作でもドラッグできるように（PC検証用）
      function setupMouseDrag() {
        let isMouseDown = false;

        appEl.addEventListener('mousedown', (e) => {
          isMouseDown = true;
          gesture.mode = 'drag';
          gesture.startX = e.clientX;
          gesture.startY = e.clientY;
          gesture.startCenterX = overlayState.centerX;
          gesture.startCenterY = overlayState.centerY;
        });

        appEl.addEventListener('mousemove', (e) => {
          if (!isMouseDown || gesture.mode !== 'drag') return;
          const dx = e.clientX - gesture.startX;
          const dy = e.clientY - gesture.startY;
          overlayState.centerX = gesture.startCenterX + dx;
          overlayState.centerY = gesture.startCenterY + dy;
          updateOverlayTransform();
        });

        const endMouse = () => {
          isMouseDown = false;
          gesture.mode = null;
        };

        appEl.addEventListener('mouseup', endMouse);
        appEl.addEventListener('mouseleave', endMouse);
      }

      // カメラ起動
      async function startCamera() {
        // 既存ストリームがあれば停止
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
          currentStream = null;
        }

        statusEl.textContent = 'カメラを起動しています…';

        const constraints = {
          audio: false,
          video: {
            facingMode: useBackCamera ? { ideal: 'environment' } : 'user'
          }
        };

        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          currentStream = stream;
          videoEl.srcObject = stream;

          videoEl.onloadedmetadata = () => {
            videoEl.play().catch(() => {
              // 自動再生できない場合はユーザー操作待ち
            });
          };

          statusEl.textContent =
            (useBackCamera ? '背面カメラでプレビュー中です。' : '前面カメラでプレビュー中です。') +
            '\n指1本でドラッグ、2本指で拡大・縮小できます。';
        } catch (err) {
          console.error(err);
          if (err.name === 'NotAllowedError') {
            statusEl.textContent = 'カメラへのアクセスが拒否されました。ブラウザの設定から許可してください。';
          } else if (err.name === 'NotFoundError') {
            statusEl.textContent = '利用可能なカメラが見つかりませんでした。別の端末でお試しください。';
          } else {
            statusEl.textContent = 'カメラの起動に失敗しました: ' + err.message;
          }
        }
      }

      function init() {
        // HTTPS or localhost の確認
        const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!window.isSecureContext && !isLocalhost) {
          statusEl.textContent =
            'カメラ機能は HTTPS または localhost でのみ利用できます。\n' +
            '開発時は http://localhost:8000/preview.html で開いてください。';
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusEl.textContent =
            'このブラウザではカメラAPIが利用できません。最新の Chrome / Safari などでお試しください。';
          return;
        }

        // オーバーレイ初期位置＆スケール反映
        overlayState.centerX = window.innerWidth / 2;
        overlayState.centerY = window.innerHeight / 2;
        overlayState.scale = 1;
        updateOverlayTransform();

        // タッチ・マウスのイベントを設定
        appEl.addEventListener('touchstart', onTouchStart, { passive: false });
        appEl.addEventListener('touchmove', onTouchMove, { passive: false });
        appEl.addEventListener('touchend', onTouchEnd);
        appEl.addEventListener('touchcancel', onTouchEnd);
        setupMouseDrag();

        // 画面サイズが変わったときも（とりあえず）位置を維持
        window.addEventListener('resize', () => {
          // 必要なら位置補正ロジックを追加
          updateOverlayTransform();
        });

        // カメラ起動
        startCamera();

        // ボタンイベント
        toggleCameraBtn.addEventListener('click', () => {
          startCamera();
        });

        flipFacingBtn.addEventListener('click', () => {
          useBackCamera = !useBackCamera;
          startCamera();
        });
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
